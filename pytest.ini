[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra

# Streamlit emits bare-mode noise when the engine runs outside `streamlit run`
# (missing ScriptRunContext, session-state fallback, MemoryCacheStorageManager).
# Most of it arrives through `logging`, not `warnings`, and is muted in
# tests/conftest.py; the filters below cover the Streamlit versions that route
# the same messages through the warnings machinery instead.
filterwarnings =
    ignore:.*ScriptRunContext.*:UserWarning
    ignore:.*Session state does not function.*:UserWarning
    ignore:.*to view a Streamlit app on a browser.*:UserWarning
