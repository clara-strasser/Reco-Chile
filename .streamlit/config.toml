# Streamlit theme / UI config. Presentation only — no behaviour lives here.
# Requires Streamlit >= 1.50 (see requirements.txt); older versions warn about
# unknown keys and fall back to defaults.

[theme]
base = "light"

# Near-monochrome with a single restrained accent.
primaryColor = "#1F6FEB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#16191D"
linkColor = "#1F6FEB"
codeBackgroundColor = "#F6F7F9"

font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15

# Soft, consistent corners; hairline borders instead of filled containers.
baseRadius = "medium"
buttonRadius = "full"
borderColor = "#E4E7EB"
dataframeBorderColor = "#E4E7EB"
showWidgetBorder = true
showSidebarBorder = false

# Muted categorical palette for any charts (risk framing, not decoration).
chartCategoricalColors = [
    "#1F6FEB",
    "#5B8DEF",
    "#8C6FE0",
    "#3FA796",
    "#C9871F",
    "#C3543E",
]

[theme.sidebar]
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E4E7EB"

[client]
# Hide developer-only toolbar entries; keep the viewer menu.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
